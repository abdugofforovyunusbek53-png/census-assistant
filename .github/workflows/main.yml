# O'zgarishlar (1.1.0 -> 1.2.0): Excel va AVTO-OQIM

`versionName 1.2.0`, `versionCode 3` (1.1.0 allaqachon berilgan; Android pastroq versiyaga o'tkazmaydi, shuning uchun 1.0.1 emas).

## O'zgargan / yangi fayllar
- `RowStore.kt` (YANGI): .xlsx ni kutubxonasiz o'qiydi, JShShIR/faoliyat/telefonni ajratadi, `rows.tsv` ga saqlaydi.
- `Text.kt`: kirill->lotin (`translit`), `matchActivity` (faoliyatni aniq moslash), `activityQueries`; `fz` endi `ʻ` `ʼ` ni ham tashlaydi.
- `Rules.kt`: Excel qatori (`row`), 2.3a/2.3d, 1.10 telefon, 4.1/4.2 (10 va 15) qoidalari.
- `Engine.kt`: `auto()` (sahifa oqimi), `searchJshshir()`, `clickNext()`, jinsni ekrandan aniqlash, faoliyat tanlash, matn bo'yicha maydon topish, tasdiqlashda 1 marta cheklangan qayta urinish.
- `DiagService.kt`: AVTO-OQIM, Excel qatoriga o'tish, ▶ = to'liq sahifa oqimi.
- `MainActivity.kt`: Excel tanlash, qator tanlash, AVTO-OQIM tugmasi.

## Excel bo'yicha muhim topilmalar (haqiqiy fayl tekshirildi)
1. **Faoliyat ustuni: G, sarlavhasi "So'rovnoma ID", lekin ichida faoliyat matni** (146 xil qiymat, masalan "Yo'lovchilarni yengil avtotransport vositalarida tashish"). Boshqa faoliyat ustuni yo'q (H "Izoh" bo'm-bo'sh). Ilova ustunni sarlavhaga emas, ma'lumotga qarab tanlaydi va importdan keyin qaysi ustun olinganini ko'rsatadi.
2. **Faylda filtr yoqilgan: faqat "m.f.y. Ma'rifat" (802 qator) ko'rinadi, 36602 qator yashirin.** Yashirin qatorlar o'tkazib yuboriladi, aks holda boshqa mahalla fuqarolaridan boshlanardi.
3. Telefon: 612 qatorda bor (12 xonali, 998...), qolganida yo'q: yo'q bo'lsa 1.10 ga hech narsa yozilmaydi. JShShIR: 14 xonali, "#N/A" yoki boshqa uzunlik yaroqsiz deb o'tkaziladi.
4. 73 ta faoliyat kirillda yozilgan (lotinda ham bor). Moslashda kirill lotinga o'giriladi (ц -> s va ts ikkala yozilishi sinaladi); 2.3d ga Excel matni AYNAN yoziladi.

## Oqim (AVTO-OQIM yoqilganda)
1/6: qoidalar (Keyingisi bosilmaydi: GPS/rasm sizniki). 2/6: qoidalar -> JShShIR yoziladi -> Qidirish -> chiqqan oyna/tugmalar tasdiqlanadi (eski mexanizm saqlangan) -> 1.10 telefon -> Keyingisi. 3/6: tasdiqlar -> 2.3a (aniq moslik, topilmasa tanlanmaydi), 2.3d, 2.4, 2.6 -> Keyingisi. 4/6: Jami=1, ayollar = ekranda ko'ringan jinsga qarab (aniqlanmasa to'xtaydi, JShShIR'dan taxmin qilinmaydi). 5/6: 4.1=10, 4.2=15 -> Keyingisi. 6/6: qoidalar, Yakunlash HECH QACHON bosilmaydi. Har sahifada bitta "!" bo'lsa Keyingisi bosilmaydi. Keyingisi bosilgach sahifa o'zgarganini tekshiradi, bir sahifada bir marta bosiladi. Anketa 6/6 ga yetib, keyin yangi 1/6 ochilsa, Excel'da keyingi qatorga o'tadi (panelda "Qator -1/+1" bor).

## Tekshiruv holati
Kompilyator va telefon yo'q: kod KOMPILYATSIYA QILINMAGAN, qurilmada sinalmagan. Excel ustunlari va faoliyat kirill/lotin mosligi haqiqiy fayl bilan Python'da alohida tekshirilgan (kirill 73 tadan 66 tasi lotin juftiga aniq mos, qolgani ts/s farqi va juftsizlar). Qurilmada sinash kerak: JShShIR maydoni va "Qidirish" tugmasini topish (ekran dump'i yo'q, sarlavha/hint bo'yicha izlanadi), 2.3a ro'yxati, jinsning ekranda ko'rinishi, 4.1/4.2 maydonlari.

