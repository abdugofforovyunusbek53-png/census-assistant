name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Kodni yuklash
        uses: actions/checkout@v4

      - name: Java 17 o‘rnatish
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.7 sozlash
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Debug APK yig‘ish
        working-directory: CensusAssistant
        run: gradle --no-daemon :app:assembleDebug

      - name: APK faylini saqlash
        uses: actions/upload-artifact@v4
        with:
          name: census-assistant-apk
          path: CensusAssistant/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
